# Build and publish the Forge mod
# Requires the following repository secrets to publish:
#   MODRINTH_TOKEN, CURSEFORGE_TOKEN
# Requires the ImmersivePortals Forge artifacts in a Maven repository
# accessible from the build environment (configured in build.gradle repositories).

name: Gradle Package

on:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'

    - name: Build with Gradle
      run: ./gradlew build

    - uses: Kir-Antipov/mc-publish@v3.3
      with:
        version-type: alpha
        dependencies: ""
        changelog: ""

        files: |
          build/libs/!(*-@(dev|sources|javadoc)).jar

        modrinth-id: wrwoMwak
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
        modrinth-featured: false

        curseforge-id: 532473
        curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

        github-token: ${{ secrets.GITHUB_TOKEN }}
