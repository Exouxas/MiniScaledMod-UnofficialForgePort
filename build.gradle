plugins {
	id 'net.minecraftforge.gradle' version '[6.0,6.2)'
	id 'org.spongepowered.mixin' version '0.7.+'
	id 'maven-publish'
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(17)
}

version = project.mod_version
group = project.maven_group
archivesBaseName = project.archives_base_name

minecraft {
	mappings channel: 'official', version: '1.20.1'

	copyIdeResources = true

	runs {
		client {
			workingDirectory project.file('run')
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'
			property 'mixin.env.remapRefMap', 'true'
			property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
			mods {
				mini_scaled {
					source sourceSets.main
				}
			}
		}
		server {
			workingDirectory project.file('run')
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'
			property 'mixin.env.remapRefMap', 'true'
			property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
			mods {
				mini_scaled {
					source sourceSets.main
				}
			}
		}
	}
}

repositories {
	mavenLocal()

	maven { url 'https://jitpack.io' }

	maven { url "https://maven.shedaniel.me/" }
}

dependencies {
	minecraft "net.minecraftforge:forge:${forge_version}"

	// ImmersivePortals for Forge (via JitPack – works in CI and local without a pre-built local Maven install)
	implementation fg.deobf("com.github.iPortalTeam.ImmersivePortalsMod:imm_ptl_core:${immptl_version}")
	implementation fg.deobf("com.github.iPortalTeam.ImmersivePortalsMod:q_misc_util:${immptl_version}")

//	implementation fg.deobf('qouteall:imm_ptl_core:3.3.1.7')
//	implementation fg.deobf('qouteall:q_misc_util:3.3.1.7')

	implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}")

	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
	add sourceSets.main, 'mini_scaled.refmap.json'
	config 'mini_scaled.mixins.json'
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/mods.toml") {
		expand "version": project.version
	}

	// Exclude Fabric-specific files
	exclude 'fabric.mod.json'
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

java {
	withSourcesJar()
}

jar {
	manifest {
		attributes([
			'Specification-Title'     : 'mini_scaled',
			'Specification-Vendor'    : 'qouteall',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.jar.archiveVersion,
			'Implementation-Vendor'   : 'qouteall',
			'MixinConfigs'            : 'mini_scaled.mixins.json'
		])
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifact(jar) {
				builtBy reobfJar
			}
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
