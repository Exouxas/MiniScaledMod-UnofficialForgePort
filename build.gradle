plugins {
	id 'net.minecraftforge.gradle' version '[6.0,6.2)'
	id 'org.spongepowered.mixin' version '0.7.+'
	id 'maven-publish'
}

def useRealImmersivePortalsDeps = (project.findProperty('useRealImmersivePortalsDeps') ?: 'false').toString().toBoolean()

java {
	toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// Compile-only API stubs for Immersive Portals (Forge) + q_misc_util.
// This makes `gradlew build` work in environments where the real artifacts are not available.
// Enable real deps by passing: -PuseRealImmersivePortalsDeps=true
sourceSets {
	ipstubs {
		java {
			srcDir 'src/ipstubs/java'
		}
		resources.srcDirs = []
		// IMPORTANT: do not include ipstubs output on its own compileClasspath
		// (otherwise Gradle creates a circular task dependency).
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath = files()
	}
}

configurations {
	ipstubsImplementation.extendsFrom implementation
}

version = project.mod_version
group = project.maven_group
archivesBaseName = project.archives_base_name

minecraft {
	mappings channel: 'official', version: '1.20.1'

	copyIdeResources = true

	runs {
		client {
			workingDirectory project.file('run')
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'
			property 'mixin.env.remapRefMap', 'true'
			property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
			mods {
				mini_scaled {
					source sourceSets.main
					if (!useRealImmersivePortalsDeps) { source sourceSets.ipstubs }
				}
			}
		}
		server {
			workingDirectory project.file('run')
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'
			property 'mixin.env.remapRefMap', 'true'
			property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
			mods {
				mini_scaled {
					source sourceSets.main
					if (!useRealImmersivePortalsDeps) { source sourceSets.ipstubs }
				}
			}
		}
		gameTestServer {
			workingDirectory project.file('run')
			property 'forge.logging.console.level', 'debug'
			property 'mixin.env.remapRefMap', 'true'
			property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
			mods {
				mini_scaled {
					source sourceSets.main
					if (!useRealImmersivePortalsDeps) { source sourceSets.ipstubs }
				}
			}
		}
	}
}

repositories {
	mavenLocal()

	maven { url 'https://jitpack.io' }

	maven { url "https://maven.shedaniel.me/" }
}

dependencies {
	minecraft "net.minecraftforge:forge:${forge_version}"

	// ImmersivePortals for Forge (Forge builds are expected in mavenLocal or another Maven repo)
	// Default is to use compile-only stubs to keep builds self-contained.
	if (useRealImmersivePortalsDeps) {
		// ImmPTL 3.0.7 ships as a single "all" jar containing both qouteall.imm_ptl.*
		// and qouteall.q_misc_util.* packages. Install it to local Maven as
		// qouteall:immersive-portals-all:3.0.7 (see Dockerfile).
		implementation fg.deobf('qouteall:immersive-portals-all:3.0.7')
	}

		implementation "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"

	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

test {
	useJUnitPlatform()
	// The plain JUnit task runs without Forge's class transformer, which normally
	// strips 'final' from methods like Entity.getBoundingBox(). When the real
	// ImmPTL jar is on the classpath, Portal overrides that 'final' method and
	// the JVM throws IncompatibleClassChangeError. Unit tests are pure-logic and
	// pass correctly in stub mode (the default build). Integration testing with
	// the real ImmPTL is done via runGameTestServer (which runs under Forge).
	enabled = !useRealImmersivePortalsDeps
	testLogging {
		events 'failed'
		exceptionFormat 'full'
		showExceptions true
		showCauses true
		showStackTraces true
	}
}

// When not using the real Immersive Portals deps, compile main sources against the stubs output.
if (!useRealImmersivePortalsDeps) {
	tasks.named('compileJava').configure {
		dependsOn tasks.named('compileIpstubsJava')
		classpath += files(sourceSets.ipstubs.output.classesDirs)
	}
	tasks.named('compileTestJava').configure {
		dependsOn tasks.named('compileIpstubsJava')
		classpath += files(sourceSets.ipstubs.output.classesDirs)
	}
	tasks.named('test').configure {
		classpath += files(sourceSets.ipstubs.output.classesDirs)
	}
	// Also put stubs on the game-test server runtime so the mod loads without real ImmPTL.
	// ForgeGradle creates the runGameTestServer task late, so use withType on JavaExec.
	afterEvaluate {
		tasks.withType(JavaExec).matching { it.name == 'runGameTestServer' }.configureEach {
			dependsOn tasks.named('compileIpstubsJava')
			classpath += files(sourceSets.ipstubs.output.classesDirs)
		}
	}
}

mixin {
	add sourceSets.main, 'mini_scaled.refmap.json'
	config 'mini_scaled.mixins.json'
}

// Generate the empty 3×3×3 air structure template used by GameTest methods.
// Minecraft structure files are gzip-compressed NBT; we build the bytes in Groovy
// to avoid needing a running game instance at build time.
// Output goes into build/ (never src/) so Gradle can track task dependencies cleanly.
def generatedStructuresDir = file("${buildDir}/generated/structures")

task generateTestStructures {
	// Forge prepends the lowercase class name to the template, so the structure
	// is looked up as 'miniscaledgametests.empty' inside the mini_scaled namespace.
	def outputFile = new File(generatedStructuresDir, "data/mini_scaled/structures/miniscaledgametests.empty.nbt")
	outputs.dir(generatedStructuresDir)
	doLast {
		// Uncompressed NBT for a 3×3×3 all-air structure (DataVersion 3463 = 1.20.1)
		int[] rawInts = [
			// TAG_Compound root (type=10, name-len=0)
			0x0A, 0x00, 0x00,
			// TAG_Int "DataVersion" = 3463 (0x00000D87)
			0x03, 0x00, 0x0B, 0x44, 0x61, 0x74, 0x61, 0x56, 0x65, 0x72, 0x73, 0x69, 0x6F, 0x6E,
			0x00, 0x00, 0x0D, 0x87,
			// TAG_List "size" = [3,3,3] (element-type=TAG_Int)
			0x09, 0x00, 0x04, 0x73, 0x69, 0x7A, 0x65,
			0x03, 0x00, 0x00, 0x00, 0x03,
			0x00, 0x00, 0x00, 0x03, 0x00, 0x00, 0x00, 0x03, 0x00, 0x00, 0x00, 0x03,
			// TAG_String "author" = "test"
			0x08, 0x00, 0x06, 0x61, 0x75, 0x74, 0x68, 0x6F, 0x72,
			0x00, 0x04, 0x74, 0x65, 0x73, 0x74,
			// TAG_List "palette" (empty, element-type=TAG_Compound)
			0x09, 0x00, 0x07, 0x70, 0x61, 0x6C, 0x65, 0x74, 0x74, 0x65,
			0x0A, 0x00, 0x00, 0x00, 0x00,
			// TAG_List "blocks" (empty)
			0x09, 0x00, 0x06, 0x62, 0x6C, 0x6F, 0x63, 0x6B, 0x73,
			0x0A, 0x00, 0x00, 0x00, 0x00,
			// TAG_List "entities" (empty)
			0x09, 0x00, 0x08, 0x65, 0x6E, 0x74, 0x69, 0x74, 0x69, 0x65, 0x73,
			0x0A, 0x00, 0x00, 0x00, 0x00,
			// TAG_End
			0x00
		]
		byte[] raw = new byte[rawInts.length]
		for (int i = 0; i < rawInts.length; i++) { raw[i] = (byte) rawInts[i] }
		outputFile.parentFile.mkdirs()
		def baos = new java.io.ByteArrayOutputStream()
		def gzos = new java.util.zip.GZIPOutputStream(baos)
		gzos.write(raw)
		gzos.close()
		outputFile.bytes = baos.toByteArray()
	}
}

processResources {
	// Include the generated empty structure template for GameTest.
	// Using from() rather than sourceSets srcDir so sourcesJar is not affected.
	from(generateTestStructures)
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	inputs.property "version", project.version

	filesMatching("META-INF/mods.toml") {
		expand "version": project.version
	}

	// Exclude Fabric-specific files
	exclude 'fabric.mod.json'
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

java {
	withSourcesJar()
}

jar {
	manifest {
		attributes([
			'Specification-Title'     : 'mini_scaled',
			'Specification-Vendor'    : 'qouteall',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.jar.archiveVersion,
			'Implementation-Vendor'   : 'qouteall',
			'MixinConfigs'            : 'mini_scaled.mixins.json'
		])
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
